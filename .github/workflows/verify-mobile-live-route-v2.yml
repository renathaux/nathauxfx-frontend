name: Verify mobile Live Trading route v2

on:
  push:
    branches:
      - fix/mobile-live-trading-route-v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Frontend/tests/mobile_live_trading_route.test.js
