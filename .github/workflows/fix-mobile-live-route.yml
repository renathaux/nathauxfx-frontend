name: Fix mobile Live Trading route

on:
  push:
    branches:
      - fix/mobile-live-trading-route

permissions:
  contents: write

jobs:
  patch-route:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-live-trading-route
          fetch-depth: 0
      - name: Preserve explicit desktop mode on phones
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Frontend/app.html')
          text = path.read_text()
          old = '''    (function () {\n      if (window.innerWidth <= 700) {\n        window.location.replace("mobile.html?from=dashboard");\n      }\n    })();'''
          new = '''    (function () {\n      const params = new URLSearchParams(window.location.search);\n      if (window.innerWidth <= 700 && params.get("desktop") !== "1") {\n        window.location.replace("mobile.html?from=dashboard");\n      }\n    })();'''
          if old not in text:
              raise SystemExit('expected mobile redirect block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- Frontend/app.html; then
            echo "No app.html change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/app.html
          git commit -m "fix: preserve explicit desktop mode on phones"
          git push origin HEAD:fix/mobile-live-trading-route
