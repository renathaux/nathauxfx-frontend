name: Strategy Studio Stage 2

on:
  pull_request:
    branches: [main]

jobs:
  simulator-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run simulator frontend tests
        run: node --test Frontend/strategy-simulator/*.test.cjs
