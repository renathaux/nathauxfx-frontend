name: Strategy Studio Stage 2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  simulator-ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run simulator and Strategy Studio regressions
        run: |
          node --test Frontend/strategy-simulator/*.test.cjs \
            Frontend/tests/strategy_studio_api.test.js \
            Frontend/tests/strategy_studio_model.test.js \
            Frontend/tests/strategy_studio_navigation.test.js \
            Frontend/tests/strategy_studio_page.test.js \
            Frontend/tests/strategy_studio_live_handoff.test.js \
            Frontend/tests/strategy_lab.test.js
          node --check Frontend/strategy-simulator/strategy-simulator-api.js
          node --check Frontend/strategy-simulator/strategy-simulator-model.js
          node --check Frontend/strategy-simulator/strategy-simulator.js
          node --check Frontend/strategy-studio/strategy-studio-api.js
          node --check Frontend/strategy-studio/strategy-studio.js
          node --check Frontend/script.js

  task7-apply:
    if: github.head_ref == 'feat/strategy-studio-live-confirmations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/strategy-studio-live-confirmations
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply Task 7 source patch when needed
        run: |
          if grep -q 'id="studioLiveReadiness"' Frontend/strategy-studio.html; then
            echo "Task 7 source patch already applied"
          else
            python scripts/apply_task7_frontend_patch.py
          fi

      - name: Verify Task 7 and regressions
        run: |
          node Frontend/tests/strategy_studio_live_handoff.test.js
          node --test Frontend/tests/strategy_studio_api.test.js \
            Frontend/tests/strategy_studio_model.test.js \
            Frontend/tests/strategy_studio_navigation.test.js \
            Frontend/tests/strategy_studio_page.test.js \
            Frontend/tests/account_switch_clear_state.test.js \
            Frontend/tests/account_switch_late_response.test.js
          node --check Frontend/strategy-studio/strategy-studio-api.js
          node --check Frontend/strategy-studio/strategy-studio.js
          node --check Frontend/script.js

      - name: Commit verified Task 7 implementation
        run: |
          rm -f scripts/apply_task7_frontend_patch.py
          cat > .github/workflows/strategy-studio-stage2.yml <<'EOF'
          name: Strategy Studio Stage 2

          on:
            pull_request:
              branches: [main]

          jobs:
            simulator-ui-tests:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Checkout
                  uses: actions/checkout@v4

                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: "22"

                - name: Run simulator and Strategy Studio regressions
                  run: |
                    node --test Frontend/strategy-simulator/*.test.cjs \
                      Frontend/tests/strategy_studio_api.test.js \
                      Frontend/tests/strategy_studio_model.test.js \
                      Frontend/tests/strategy_studio_navigation.test.js \
                      Frontend/tests/strategy_studio_page.test.js \
                      Frontend/tests/strategy_studio_live_handoff.test.js \
                      Frontend/tests/strategy_lab.test.js
                    node --check Frontend/strategy-simulator/strategy-simulator-api.js
                    node --check Frontend/strategy-simulator/strategy-simulator-model.js
                    node --check Frontend/strategy-simulator/strategy-simulator.js
                    node --check Frontend/strategy-studio/strategy-studio-api.js
                    node --check Frontend/strategy-studio/strategy-studio.js
                    node --check Frontend/script.js
          EOF
          sed -i 's/^          //' .github/workflows/strategy-studio-stage2.yml
          git config user.name "renathaux"
          git config user.email "charlesdieufort2@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Task 7 changes to commit"
            exit 0
          fi
          git diff --cached --check
          git commit -m "feat: add gated Strategy Studio LIVE confirmation UI"
          git push origin HEAD:feat/strategy-studio-live-confirmations
