name: Patch mobile menu panel routing

on:
  push:
    branches:
      - fix/mobile-menu-panel-routing

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-menu-panel-routing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/patch_mobile_menu_panel_routing.py
      - name: Run focused tests
        run: node --test Frontend/tests/mobile_live_trading_route.test.js Frontend/tests/mobile_menu_panel_routing.test.js
      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frontend/mobile.html Frontend/app.html Frontend/startup.js Frontend/mobileNav.js Frontend/tests/mobile_menu_panel_routing.test.js
          git commit -m "fix: keep mobile menu panels in mobile flow"
          git push origin HEAD:fix/mobile-menu-panel-routing
