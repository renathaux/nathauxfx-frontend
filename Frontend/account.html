<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NathauxFX Account</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020812;color:#eaf3ff;font-family:Inter,Arial,sans-serif}.wrap{width:min(430px,calc(100vw - 32px));padding:30px;border:1px solid #1c4f7f;border-radius:20px;background:linear-gradient(180deg,#081624 0%,#05101c 100%);box-shadow:0 24px 80px rgba(0,0,0,.45)}.brand{font-size:22px;font-weight:800}.brand span{margin-left:8px;padding:4px 8px;border:1px solid #1688ff;border-radius:999px;color:#79baff;font-size:10px;letter-spacing:.16em}h1{margin:28px 0 8px;font-size:30px}.copy{margin:0 0 24px;color:#93a9c1;line-height:1.5}.form{display:grid;gap:16px}.field{display:grid;gap:7px;color:#a9bbce;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.field input{width:100%;padding:13px 14px;border:1px solid #244866;border-radius:10px;background:#07111e;color:#eef6ff;outline:none;font:inherit}.field input:focus{border-color:#1688ff;box-shadow:0 0 0 3px rgba(22,136,255,.13)}.otp-input{text-align:center!important;font-size:28px!important;font-weight:800!important;letter-spacing:10px!important;padding-left:24px!important}button{font:inherit}.submit{margin-top:4px;padding:13px;border:0;border-radius:10px;background:#087df2;color:#fff;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.link{width:100%;margin-top:14px;border:0;background:transparent;color:#69adff;cursor:pointer}.link:disabled{opacity:.5;cursor:wait}.error{min-height:20px;margin:12px 0 0;color:#ff7474;font-size:12px}.success{min-height:20px;margin:12px 0 0;color:#64d98b;font-size:12px}.hidden{display:none!important}.otp-meta{margin:-8px 0 2px;color:#7f97b0;font-size:12px;text-align:center}@media(max-width:600px){.wrap{padding:24px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">NathauxFX</div>
    <section id="authPanel">
      <h1 id="title">Log in</h1>
      <p class="copy">Sign in to your NathauxFX account.</p>
      <form id="form" class="form">
        <label id="nameWrap" class="field hidden">Full name<input id="fullName" type="text" autocomplete="name" minlength="2" maxlength="160"></label>
        <label class="field">Email<input id="email" type="email" autocomplete="username" required></label>
        <label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
        <label id="confirmWrap" class="field hidden">Confirm password<input id="confirm" type="password" minlength="10" autocomplete="new-password"></label>
        <button id="submit" class="submit" type="submit">Log in</button>
      </form>
      <button id="forgot" class="link" type="button">Forgot password?</button>
      <button id="switch" class="link" type="button">Create account</button>
    </section>
    <section id="approvalPanel" class="hidden">
      <h1>Thank you</h1>
      <p class="copy">Your email is verified. Please wait for an administrator to approve your account.</p>
      <p class="copy">We will email you when your access is approved.</p>
      <button id="returnLoginBtn" class="submit" type="button">Return to login</button>
    </section>
    <section id="otpPanel" class="hidden">
      <h1>Check your email</h1>
      <p id="otpCopy" class="copy">We sent a 6-digit verification code.</p>
      <form id="otpForm" class="form">
        <label class="field">Verification code<input id="otpCode" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required></label>
        <div class="otp-meta">Code expires in 10 minutes.</div>
        <button id="verifyBtn" class="submit" type="submit">Verify email</button>
      </form>
      <button id="resendBtn" class="link" type="button">Resend code</button>
      <button id="changeEmailBtn" class="link" type="button">Use a different email</button>
    </section>
    <button id="home" class="link" type="button">Back to home</button>
    <p id="error" class="error"></p><p id="success" class="success"></p>
  </main>
  <script>
  (function(){
    'use strict';
    const IS_LOCAL=location.hostname==='localhost'||location.hostname==='127.0.0.1';
    const BACKEND=IS_LOCAL?'http://127.0.0.1:8001':`${location.origin}/api/proxy`;
    const PUBLIC_HOME_KEY='flowsignal_public_home_mode',TAB_SIGNED_OUT_KEY='flowsignal_tab_signed_out',USER_SESSION_KEY='flowsignal_user_session_token',PERSISTED_USER_SESSION_KEY='flowsignal_user_session_persist',COOKIE_SESSION_SENTINEL='__flowsignal_cookie_session__',LOGIN_HINT_COOKIE='flowsignal_login_hint',TAB_WINDOW_PREFIX='flowsignal-tab:';
    const params=new URLSearchParams(location.search);let signup=params.get('mode')==='signup',pendingEmail='',resendTimer=null,loginStarted=false;
    const $=id=>document.getElementById(id),title=$('title'),authPanel=$('authPanel'),otpPanel=$('otpPanel'),approvalPanel=$('approvalPanel'),form=$('form'),otpForm=$('otpForm'),email=$('email'),fullName=$('fullName'),nameWrap=$('nameWrap'),password=$('password'),confirm=$('confirm'),confirmWrap=$('confirmWrap'),submit=$('submit'),switchBtn=$('switch'),forgotBtn=$('forgot'),home=$('home'),error=$('error'),success=$('success'),otpCode=$('otpCode'),otpCopy=$('otpCopy'),verifyBtn=$('verifyBtn'),resendBtn=$('resendBtn'),changeEmailBtn=$('changeEmailBtn'),returnLoginBtn=$('returnLoginBtn');
    function ensureTabId(){const current=String(window.name||'');if(current.startsWith(TAB_WINDOW_PREFIX)&&current.length>TAB_WINDOW_PREFIX.length)return current.slice(TAB_WINDOW_PREFIX.length);const id=crypto.randomUUID?.()||`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;window.name=TAB_WINDOW_PREFIX+id;return id;}
    function setLoginHint(){try{document.cookie=`${LOGIN_HINT_COOKIE}=1; Max-Age=315360000; Path=/; Secure; SameSite=Lax`;}catch(_e){}}
    function clearLoginHint(){try{document.cookie=`${LOGIN_HINT_COOKIE}=; Max-Age=0; Path=/; Secure; SameSite=Lax`;}catch(_e){}}
    function detailCode(data){if(typeof data?.detail==='string')return data.detail;if(data?.detail&&typeof data.detail==='object')return data.detail.code||'AUTHENTICATION_FAILED';return 'AUTHENTICATION_FAILED';}
    function friendly(v){return String(v||'Something went wrong').replaceAll('_',' ').toLowerCase().replace(/^./,c=>c.toUpperCase());}
    function clearMessages(){error.textContent='';success.textContent='';}
    function markUser(csrf=''){const now=Date.now();sessionStorage.setItem('flowsignal_tab_role','user');sessionStorage.removeItem(PUBLIC_HOME_KEY);sessionStorage.removeItem(TAB_SIGNED_OUT_KEY);sessionStorage.setItem('flowsignal_user_portal_intent','1');if(csrf)sessionStorage.setItem('flowsignal_csrf_token',String(csrf));localStorage.setItem('flowsignal_role','user');localStorage.setItem('flowsignal_access',JSON.stringify({granted:true,time:now}));setLoginHint();}
    function finishSession(data){if(!data.session_token)throw new Error('SESSION_TOKEN_MISSING');const tabId=ensureTabId(),now=Date.now(),token=String(data.session_token),csrf=String(data.csrf_token||'');sessionStorage.setItem(USER_SESSION_KEY,token);localStorage.setItem(`flowsignal_tab_user_session:${tabId}`,JSON.stringify({token,csrf}));localStorage.setItem(PERSISTED_USER_SESSION_KEY,JSON.stringify({token,csrf,saved_at:now}));markUser(csrf);location.replace('/app?user=1');}
    function finishOwnerSession(data){
      if(data?.ok!==true||data.role!=='admin'||!String(data.token||'').trim())throw new Error('AUTHENTICATION_FAILED');
      const token=String(data.token).trim(),tabId=ensureTabId();
      [USER_SESSION_KEY,'flowsignal_binary_user_id','flowsignal_csrf_token','flowsignal_user_portal_intent',TAB_SIGNED_OUT_KEY,PUBLIC_HOME_KEY].forEach(key=>sessionStorage.removeItem(key));
      localStorage.removeItem(PERSISTED_USER_SESSION_KEY);
      localStorage.removeItem(`flowsignal_tab_user_session:${tabId}`);
      clearLoginHint();
      sessionStorage.setItem('flowsignal_tab_role','admin');
      localStorage.setItem(`flowsignal_tab_admin_session:${tabId}`,JSON.stringify({token}));
      localStorage.setItem('flowsignal_session_token',token);
      localStorage.setItem('flowsignal_role','admin');
      localStorage.setItem('flowsignal_access',JSON.stringify({granted:true,time:Date.now()}));
      location.replace('/app');
    }
    async function tryOwnerLogin(credentials){
      const response=await fetch(`${BACKEND}/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(credentials)});
      if(!response.ok&&response.status!==401&&response.status!==403)throw new Error('LOGIN_UNAVAILABLE_TRY_AGAIN');
      const data=await response.json();
      if(response.ok&&data.ok===true&&data.role==='admin'){
        finishOwnerSession(data);
        return true;
      }
      return false;
    }
    function finishCookieSession(data){sessionStorage.setItem(USER_SESSION_KEY,COOKIE_SESSION_SENTINEL);markUser(data?.csrf_token||'');location.replace('/app?user=1');}
    function render(){authPanel.classList.remove('hidden');otpPanel.classList.add('hidden');approvalPanel.classList.add('hidden');title.textContent=signup?'Create account':'Log in';submit.textContent=signup?'Create account':'Log in';switchBtn.textContent=signup?'Already have an account? Log in':'Create account';forgotBtn.classList.toggle('hidden',signup);nameWrap.classList.toggle('hidden',!signup);confirmWrap.classList.toggle('hidden',!signup);fullName.required=signup;password.autocomplete=signup?'new-password':'current-password';if(signup)password.minLength=10;else password.removeAttribute('minlength');confirm.required=signup;pendingEmail='';clearMessages();if(params.get('reset')==='1'&&!signup)success.textContent='Password reset. Log in with your new password.';if(params.get('expired')==='1'&&!signup)error.textContent='Your session expired. Log in again to continue.';}
    function startResendCountdown(seconds=60){if(resendTimer)clearInterval(resendTimer);let left=Math.max(0,Number(seconds)||60);const draw=()=>{resendBtn.textContent=left>0?`Resend code in ${left}s`:'Resend code';resendBtn.disabled=left>0;};draw();resendTimer=setInterval(()=>{left-=1;draw();if(left<=0){clearInterval(resendTimer);resendTimer=null;}},1000);}
    function showOtp(actualEmail,maskedEmail,resendAfter=60){pendingEmail=String(actualEmail||'').trim().toLowerCase();authPanel.classList.add('hidden');otpPanel.classList.remove('hidden');otpCopy.textContent=`We sent a 6-digit code to ${maskedEmail||pendingEmail}.`;otpCode.value='';clearMessages();startResendCountdown(resendAfter);setTimeout(()=>otpCode.focus(),50);}
    async function resumeExistingSession(){let saved=null;try{saved=JSON.parse(localStorage.getItem(PERSISTED_USER_SESSION_KEY)||'null');}catch(_e){}try{const headers={};if(saved?.token)headers.Authorization=`FlowSignalUser ${String(saved.token)}`;const response=await fetch(`${BACKEND}/auth/session`,{cache:'no-store',headers});if(!response.ok){if(response.status<500&&response.status!==408&&response.status!==429){localStorage.removeItem(PERSISTED_USER_SESSION_KEY);clearLoginHint();}return false;}const data=await response.json().catch(()=>null);if(loginStarted)return false;if(data?.authenticated&&data?.user){if(saved?.token)finishSession({session_token:String(saved.token),csrf_token:String(data.csrf_token||saved.csrf||'')});else finishCookieSession(data);return true;}if(data&&data.authenticated===false){localStorage.removeItem(PERSISTED_USER_SESSION_KEY);clearLoginHint();}}catch(_e){}return false;}
    switchBtn.addEventListener('click',()=>{signup=!signup;history.replaceState(null,'',`/account.html?mode=${signup?'signup':'login'}`);render();});forgotBtn.addEventListener('click',()=>location.href='/reset-password.html');changeEmailBtn.addEventListener('click',render);returnLoginBtn.addEventListener('click',()=>{signup=false;history.replaceState(null,'','/account.html?mode=login');render();});home.addEventListener('click',()=>{sessionStorage.removeItem(PUBLIC_HOME_KEY);sessionStorage.removeItem('flowsignal_tab_role');location.replace('/');});
    form.addEventListener('submit',async e=>{e.preventDefault();if(signup&&password.value!==confirm.value){error.textContent='Passwords do not match.';return;}loginStarted=true;submit.disabled=true;clearMessages();try{const credentials={email:email.value.trim(),password:password.value};if(!signup&&await tryOwnerLogin(credentials))return;const payload={email:email.value.trim(),password:password.value};if(signup)payload.full_name=fullName.value.trim();const response=await fetch(`${BACKEND}/auth/${signup?'signup':'login'}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json().catch(()=>({})),verificationDetail=data?.detail&&typeof data.detail==='object'?data.detail:null;if(response.status===403&&verificationDetail?.code==='EMAIL_VERIFICATION_REQUIRED'){showOtp(email.value,verificationDetail.email,60);return;}if(response.status===403&&verificationDetail?.code==='ADMIN_APPROVAL_PENDING'){error.textContent='Thank you. Your email is verified. Please wait for administrator approval.';return;}if(!response.ok)throw new Error(detailCode(data));if(data.verification_required){showOtp(email.value,data.email,data.resend_after||60);return;}finishSession(data);}catch(err){error.textContent=friendly(err.message||'Authentication failed');}finally{submit.disabled=false;}});
    otpForm.addEventListener('submit',async e=>{e.preventDefault();const code=otpCode.value.replace(/\D/g,'').slice(0,6);if(code.length!==6){error.textContent='Enter the 6-digit code.';return;}verifyBtn.disabled=true;clearMessages();try{const response=await fetch(`${BACKEND}/auth/verify-email`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pendingEmail,code})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(detailCode(data));authPanel.classList.add('hidden');otpPanel.classList.add('hidden');approvalPanel.classList.remove('hidden');clearMessages();}catch(err){error.textContent=friendly(err.message||'Verification failed');}finally{verifyBtn.disabled=false;}});
    resendBtn.addEventListener('click',async()=>{if(!pendingEmail)return;resendBtn.disabled=true;clearMessages();try{const response=await fetch(`${BACKEND}/auth/resend-verification`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:pendingEmail})});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(detailCode(data));success.textContent='A new verification code was sent.';startResendCountdown(data.resend_after||60);}catch(err){const code=String(err.message||'');error.textContent=code==='VERIFICATION_CODE_COOLDOWN'?'Please wait before requesting another code.':friendly(code||'Could not resend code');if(code==='VERIFICATION_CODE_COOLDOWN')startResendCountdown(60);else resendBtn.disabled=false;}});
    otpCode.addEventListener('input',()=>{otpCode.value=otpCode.value.replace(/\D/g,'').slice(0,6);});render();if(sessionStorage.getItem(TAB_SIGNED_OUT_KEY)!=='1'&&params.get('logged_out')!=='1')resumeExistingSession();
  })();
  </script>
</body>
</html>
