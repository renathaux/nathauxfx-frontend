<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NathauxFX Owner</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020812;color:#eaf3ff;font-family:Inter,Arial,sans-serif}.wrap{width:min(430px,calc(100vw - 32px));padding:30px;border:1px solid #1c4f7f;border-radius:20px;background:linear-gradient(180deg,#081624 0%,#05101c 100%);box-shadow:0 24px 80px rgba(0,0,0,.45)}.brand{font-size:22px;font-weight:800}.brand span{margin-left:8px;padding:4px 8px;border:1px solid #1688ff;border-radius:999px;color:#79baff;font-size:10px;letter-spacing:.16em}h1{margin:28px 0 8px;font-size:30px}.copy{margin:0 0 24px;color:#93a9c1}.form{display:grid;gap:16px}.field{display:grid;gap:7px;color:#a9bbce;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.field input{width:100%;padding:13px 14px;border:1px solid #244866;border-radius:10px;background:#07111e;color:#eef6ff;outline:none;font:inherit}.field input:focus{border-color:#1688ff;box-shadow:0 0 0 3px rgba(22,136,255,.13)}button{font:inherit}.submit{margin-top:4px;padding:13px;border:0;border-radius:10px;background:#087df2;color:#fff;font-weight:800;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.link{width:100%;margin-top:14px;border:0;background:transparent;color:#69adff;cursor:pointer}.error{min-height:20px;margin:12px 0 0;color:#ff7474;font-size:12px}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">NathauxFX <span>OWNER</span></div>
    <h1>Owner login</h1>
    <p class="copy">Admin access only. The trading dashboard stays disabled until authentication succeeds.</p>
    <form id="form" class="form">
      <label class="field">Email<input id="email" type="email" autocomplete="username" required></label>
      <label class="field">Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button id="submit" class="submit" type="submit">Log in as owner</button>
    </form>
    <button id="home" class="link" type="button">Back to home</button>
    <p id="error" class="error"></p>
  </main>
  <script>
    (function(){
      'use strict';
      try{window.speechSynthesis?.cancel?.();}catch(_error){}
      const BACKEND='https://api.nathauxfx.com';
      const TAB_WINDOW_PREFIX='flowsignal-tab:';
      const OWNER_TOKEN_KEY='flowsignal_session_token';
      const ROLE_KEY='flowsignal_role';
      function ensureTabId(){
        const current=String(window.name||'');
        if(current.startsWith(TAB_WINDOW_PREFIX)&&current.length>TAB_WINDOW_PREFIX.length)return current.slice(TAB_WINDOW_PREFIX.length);
        const id=(crypto.randomUUID?.()||`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`);
        window.name=TAB_WINDOW_PREFIX+id;
        return id;
      }
      function enterOwnerSession(token){
        const value=String(token||'').trim();
        if(!value)return false;
        sessionStorage.removeItem('flowsignal_user_session_token');
        sessionStorage.removeItem('flowsignal_binary_user_id');
        sessionStorage.removeItem('flowsignal_tab_signed_out');
        sessionStorage.removeItem('flowsignal_public_home_mode');
        const tabId=ensureTabId();
        sessionStorage.setItem('flowsignal_tab_role','admin');
        localStorage.setItem(`flowsignal_tab_admin_session:${tabId}`,JSON.stringify({token:value}));
        localStorage.setItem('flowsignal_access',JSON.stringify({granted:true,time:Date.now()}));
        localStorage.setItem(ROLE_KEY,'admin');
        localStorage.setItem(OWNER_TOKEN_KEY,value);
        location.replace('/app');
        return true;
      }
      function resumeExistingOwner(){
        try{
          const role=String(localStorage.getItem(ROLE_KEY)||'').toLowerCase();
          const token=String(localStorage.getItem(OWNER_TOKEN_KEY)||'').trim();
          if(role==='admin'&&token)return enterOwnerSession(token);
        }catch(_error){}
        return false;
      }

      if(resumeExistingOwner())return;

      const form=document.getElementById('form');
      const email=document.getElementById('email');
      const password=document.getElementById('password');
      const submit=document.getElementById('submit');
      const error=document.getElementById('error');
      document.getElementById('home').onclick=()=>location.replace('/');
      form.addEventListener('submit',async(event)=>{
        event.preventDefault();
        submit.disabled=true;
        error.textContent='';
        try{
          const res=await fetch(`${BACKEND}/login`,{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({email:email.value.trim(),password:password.value})
          });
          const data=await res.json().catch(()=>({}));
          if(!res.ok||!data.ok||data.role!=='admin'||!data.token) throw new Error(data.detail||data.message||'Invalid admin login');
          enterOwnerSession(data.token);
        }catch(err){error.textContent=String(err.message||'Login failed').replaceAll('_',' ');}finally{submit.disabled=false;}
      });
    })();
  </script>
</body>
</html>
